name: Build and attach release artifacts

on:
  release:
    types:
      - published

env:
  APP_NAME: "Andante"
  APP_VERSION: "1.2"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: 'oracle-openjdk'
          java-version: '21'

      - name: Compile and package
        run: |
          mkdir -p bin "$APP_NAME"
          find src -name "*.java" > sources.txt
          javac --release 17 -d bin @sources.txt
          jar cvfm "$APP_NAME.jar" src/META-INF/MANIFEST.MF -C bin .
          cp "$APP_NAME.jar" LICENSE README.md "$APP_NAME/"
          zip -r "${APP_NAME}_${APP_VERSION}.zip" "$APP_NAME"

      - name: Upload asset
        run: gh release upload "$GITHUB_REF_NAME" "${APP_NAME}_${APP_VERSION}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
